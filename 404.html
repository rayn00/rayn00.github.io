<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>ページが見つかりません | AME LAB 雨宮研究室</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0d14;
            --text: #f0f4f8;
            --muted: #94a3b8;
            --cyan: #00f2fe;
            --purple: #7f00ff;
            --border: rgba(255, 255, 255, 0.12);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f8fafc;
                --text: #0f172a;
                --muted: #475569;
                --cyan: #0369a1;
                --purple: #7c3aed;
                --border: rgba(0, 0, 0, 0.12);
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem 1rem;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            text-align: center;
        }

        .code {
            margin: 0;
            font-size: clamp(4rem, 18vw, 7rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1;
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        h1 {
            margin: 1rem 0 0.5rem;
            font-size: 1.25rem;
        }

        p {
            margin: 0 0 2rem;
            color: var(--muted);
            line-height: 1.8;
        }

        a {
            display: inline-block;
            padding: 0.75rem 1.75rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            border-color: var(--cyan);
            color: var(--cyan);
        }
    </style>
</head>
<body>
    <main>
        <p class="code">404</p>
        <h1>ページが見つかりません</h1>
        <p>お探しのページは移動または削除された可能性があります。<br>
            <span lang="en">The page you are looking for could not be found.</span></p>
        <a id="homeLink" href="/">AME LAB トップへ戻る / Back to top</a>
    </main>
    <script>
        // GitHub Pages のプロジェクトサイト（ユーザー名.github.io/リポジトリ名/）では、
        // トップページは「/リポジトリ名/」になるため、URLから戻り先を求める。
        // 独自ドメインや「ユーザー名.github.io」リポジトリで公開する場合は SITE_ROOT = '/' にする。
        //var SITE_ROOT = null;
        var SITE_ROOT = '/';
        (function () {
            var parts = location.pathname.split('/').filter(Boolean);
            var home = SITE_ROOT || ((/\.github\.io$/.test(location.hostname) && parts.length) ? '/' + parts[0] + '/' : '/');
            document.getElementById('homeLink').setAttribute('href', home);
        })();
    </script>
</body>
</html>
