<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>ページが見つかりません | AME LAB 雨宮研究室</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0d14;
            --text: #f0f4f8;
            --muted: #94a3b8;
            --cyan: #00f2fe;
            --purple: #7f00ff;
            --border: rgba(255, 255, 255, 0.12);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f8fafc;
                --text: #0f172a;
                --muted: #475569;
                --cyan: #0369a1;
                --purple: #7c3aed;
                --border: rgba(0, 0, 0, 0.12);
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem 1rem;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            text-align: center;
        }

        .code {
            margin: 0;
            font-size: clamp(4rem, 18vw, 7rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1;
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        h1 {
            margin: 1rem 0 0.5rem;
            font-size: 1.25rem;
        }

        p {
            margin: 0 0 2rem;
            color: var(--muted);
            line-height: 1.8;
        }

        a {
            display: inline-block;
            padding: 0.75rem 1.75rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            border-color: var(--cyan);
            color: var(--cyan);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.75rem;
        }

        .actions a[hidden] {
            display: none;
        }

        .note {
            max-width: 34em;
            margin: -1rem auto 2rem;
            font-size: 0.9rem;
        }

        .note[hidden] {
            display: none;
        }
    </style>
</head>
<body>
    <main>
        <p class="code">404</p>
        <h1>ページが見つかりません</h1>
        <p>お探しのページは移動または削除された可能性があります。<br>
            <span lang="en">The page you are looking for could not be found.</span></p>
        <p class="note" id="oldNote" hidden>2026年10月にWebサイトを新しくしました。以前のページは旧サイトでご覧いただけます。<br>
            <span lang="en">We launched a new website in October 2026. Earlier pages are still available on the previous site.</span></p>
        <div class="actions">
            <a id="newLink" href="/" hidden></a>
            <a id="oldLink" href="https://wwwold.amelab.vr.u-tokyo.ac.jp/" hidden>旧サイトで見る / Previous site</a>
            <a id="homeLink" href="/">AME LAB トップへ戻る / Back to top</a>
        </div>
    </main>
    <script>
        // GitHub Pages のプロジェクトサイト（ユーザー名.github.io/リポジトリ名/）では、
        // トップページは「/リポジトリ名/」になるため、URLから戻り先を求める。
        // 独自ドメインや「ユーザー名.github.io」リポジトリで公開する場合は SITE_ROOT = '/' にする。
        //var SITE_ROOT = null;
        var SITE_ROOT = '/';

        // 旧サイト（Google サイト）。以前のURL（例：/about-us、/openlab2026）で来た人を案内する
        var OLD_SITE = 'https://wwwold.amelab.vr.u-tokyo.ac.jp';
        // 旧サイトのページ名 → 新しいサイトのページ
        var MOVED = {
            'home': ['index.html', 'トップページ', 'Top page'],
            'news': ['news.html', 'ニュース', 'News'],
            'members': ['members.html', 'メンバー', 'Members'],
            'member': ['members.html', 'メンバー', 'Members'],
            'publications': ['publications.html', '論文・発表一覧', 'Publications'],
            'publication': ['publications.html', '論文・発表一覧', 'Publications'],
            'research': ['research.html', '研究紹介', 'Research'],
            'about-us': ['index.html#about', '研究室概要', 'About'],
            'about': ['index.html#about', '研究室概要', 'About'],
            'access': ['index.html#contact', 'アクセス・問い合わせ', 'Contact'],
            'contact': ['index.html#contact', 'アクセス・問い合わせ', 'Contact'],
            'faq': ['faq.html', 'よくある質問', 'FAQ'],
            'collaboration': ['collaboration.html', '共同研究・産学連携', 'Collaboration']
        };
        (function () {
            var parts = location.pathname.split('/').filter(Boolean);
            var home = SITE_ROOT || ((/\.github\.io$/.test(location.hostname) && parts.length) ? '/' + parts[0] + '/' : '/');
            document.getElementById('homeLink').setAttribute('href', home);
            if (!SITE_ROOT && /\.github\.io$/.test(location.hostname)) parts.shift();
            if (!parts.length) return;

            var first = decodeURIComponent(parts[0]).toLowerCase().replace(/\.html?$/, '');
            var to = MOVED[first] || (/^openlab/.test(first) ? ['index.html#prospective', '配属・連携案内', 'Admissions'] : null);
            // 旧サイトの見出しへのリンク（#h.…）は、旧サイトのその記事を開けるように残す
            var oldAnchor = /^#h\./.test(location.hash);
            if (to && parts.length === 1 && !oldAnchor) {
                location.replace(home + to[0]);
                return;
            }
            if (to) {
                var a = document.getElementById('newLink');
                a.href = home + to[0];
                a.textContent = '新しいサイトの「' + to[1] + '」 / ' + to[2];
                a.hidden = false;
            }
            var old = document.getElementById('oldLink');
            old.href = OLD_SITE + location.pathname + location.search + location.hash;
            old.textContent = '旧サイトの同じページを開く / Open on the previous site';
            old.hidden = false;
            document.getElementById('oldNote').hidden = false;
        })();
    </script>
</body>
</html>
